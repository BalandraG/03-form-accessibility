<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mystery Dining Reservations</title>
  <!-- Google Fonts  -->
  <link
    href="https://fonts.googleapis.com/css2?family=Brandon+Text:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <!-- Link to Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
 
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="visually-hidden-focusable" href="#main-content">Skip to main content</a>
  <header>
    <div class="container header-container">
      <div class="logo">🔎 Mystery Dining</div>
      <nav aria-label="Primary navigation">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Reservations</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <section class="hero">
      <div class="hero-content">
        <h1>Experience the Unknown</h1>
        <p>
          Reserve your seat and embark on a surprise culinary adventure.
        </p>
        <div class="reservation-card">
          <h2 id="reservation-heading">Reserve Now</h2>
          <div class="form-placeholder">
            <form aria-labelledby="reservation-heading">
              <div class="mb-3">
                <label class="form-label" for="name">Name</label>
                <input id="name" name="name" type="text" class="form-control" autocomplete="name" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input id="email" name="email" type="email" class="form-control" autocomplete="email" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="zip">ZIP code</label>
                <input id="zip" name="zip" type="text" class="form-control" autocomplete="postal-code" inputmode="numeric" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="party-size">Party size</label>
                <input id="party-size" name="party-size" type="number" class="form-control" min="1" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="spice-level">Preferred spice level</label>
                <select id="spice-level" name="spice-level" class="form-select" required>
                  <option value="" selected disabled>Choose a spice level</option>
                  <option value="mild">Mild</option>
                  <option value="medium">Medium</option>
                  <option value="spicy">Spicy</option>
                </select>
              </div>
              <div class="form-check mb-3">
                <input id="birthday" name="birthday" class="form-check-input" type="checkbox">
                <label class="form-check-label" for="birthday">
                  Would you like to pretend it's your birthday for free cake?
                </label>
              </div>
              <div class="form-check mb-3">
                <input id="accept-mystery" name="accept-mystery" class="form-check-input" type="checkbox" required>
                <label class="form-check-label" for="accept-mystery">
                  I accept that I have no idea where I'll dine, and that's OK.
                </label>
              </div>
              <button type="submit" class="btn btn-lg btn-primary">Book My Mystery Meal!</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 Mystery Dining. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
